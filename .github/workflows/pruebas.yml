# Revisa los tipos, corre las pruebas y compila en cada push y pull request a main
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    # El .env no está en el repositorio. Las pruebas y la compilación no se conectan a Firebase,
    # así que bastan valores de relleno.
    env:
      VITE_FIREBASE_API_KEY: ci
      VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci
      VITE_FIREBASE_STORAGE_BUCKET: ci.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
      VITE_FIREBASE_APP_ID: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npx vitest run
      - run: npm run build

      # Las reglas de Firestore se prueban contra el emulador, que necesita Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:reglas
